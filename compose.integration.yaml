services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: "8080"
    ports:
      - "18080:8080"

  web:
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "13000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
